<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמה | Premium Gaming</title>
     <script defer src="js/new.js"></script>
    <link rel="stylesheet" href="css/new.css">
</head>
<body>

<div class="register-card">
    <h2>יצירת חשבון</h2>
    <p>הצטרף לקהילת הגיימינג המובילה</p>

    <form>
        <div class="input-row">
            <div style="flex: 1;">
                <input type="text" placeholder="שם פרטי">
            </div>
            <div style="flex: 1;">
                <input type="text" placeholder="שם משפחה">
            </div>
        </div>

        <div class="input-group">
            <input type="email" placeholder="אימייל">
        </div>

        <div class="input-group">
            <input type="text" placeholder="שם משתמש" id="username">
        </div>

        <div class="input-group">
            <input type="password" placeholder="סיסמה " id="password">
        </div>



        <button type="button">צור חשבון עכשיו</button>
    </form>

    <div class="login-link">
        כבר יש לך חשבון? <a href="project.html">התחבר כאן</a>
    </div>
</div>

</body>
</html>
